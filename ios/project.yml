name: OpenHaldex
options:
  bundleIdPrefix: com.tristar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TPJ8J8524S
    CODE_SIGN_STYLE: Automatic
targets:
  OpenHaldex:
    type: application
    platform: iOS
    sources:
      - path: OpenHaldex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristar.openhaldex
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenHaldex
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "OpenHaldex connects to your OpenHaldex controller over Bluetooth to show live Haldex data and change modes."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
